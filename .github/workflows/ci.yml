name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-24.04 # Playwright 1.57 cannot install browsers on ubuntu-latest (26.04)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Typecheck
        run: yarn typecheck

      - name: Semi-bandit feedback invariants
        run: node --test tests/semibandit-feedback.test.mjs

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Test book reader with synthetic content
        run: yarn playwright test --config playwright.books.config.mjs
